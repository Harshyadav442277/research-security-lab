name: Experiments

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  experiments:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: In-memory policy cases
        run: python run_experiments.py --output results/ci-core.json
      - name: Persistent ledger cases
        run: python run_persistence.py --output results/ci-persistence.json
      - name: Container smoke tests
        if: runner.os == 'Linux'
        run: |
          docker build -t research-security-lab .
          docker run --rm --network none research-security-lab
          docker run --rm --network none --entrypoint python research-security-lab run_persistence.py --output /tmp/results/persistence.json
      - name: Save measured outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: outcomes-${{ matrix.os }}
          path: results/ci-*
          if-no-files-found: warn
          retention-days: 7
